<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Triton Financial Solutions — message line</title>
    <meta
      name="description"
      content="Local voice test for the Triton Financial Solutions receptionist. She takes a message for the team."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <p class="eyebrow">Triton Financial Solutions, LLC</p>
      <h1>Message line</h1>
      <p class="lede">
        She answers as an AI, tells you the call is transcribed, and takes a message for the team at
        DebtMarket. This page is the browser test. It does not place a call to 561-254-6608.
      </p>
    </header>
    <main>
      <section class="panel" aria-labelledby="status-heading">
        <h2 id="status-heading">Setup</h2>
        <p id="status-summary">Checking which keys are configured…</p>
        <ul id="status-list"></ul>
      </section>
      <section class="panel conversation" aria-labelledby="call-heading">
        <h2 id="call-heading">Talk or type</h2>
        <div id="log" class="log" role="log" aria-live="polite"></div>
        <form id="composer">
          <label for="utterance">Your reply</label>
          <textarea id="utterance" name="utterance" rows="3" required placeholder="Type what you would say"></textarea>
          <div class="actions">
            <button type="submit">Send</button>
            <button type="button" id="mic">Speak</button>
            <button type="button" id="stop-speech">Stop voice</button>
          </div>
          <p id="mic-note" class="note"></p>
        </form>
        <p id="result" class="result" hidden></p>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
