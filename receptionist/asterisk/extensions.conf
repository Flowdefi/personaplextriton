; Open-source phone entry for the Triton receptionist.
; Copy into /etc/asterisk/extensions.conf and reload the dialplan.
; Forward 561-254-6608 from the carrier to the SIP number that lands here.
; This file does not port or own 561-254-6608.

[triton-desk]
exten => s,1,Answer()
 same => n,Set(CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,System(/opt/triton-receptionist/asterisk/triton-call.sh ${UNIQUEID} ${CALLER})
 same => n,Hangup()
